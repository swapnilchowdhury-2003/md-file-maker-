
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); background: var(--color-background-tertiary); }

  .gdoc-shell {
    display: flex;
    flex-direction: column;
    height: 640px;
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }

  .gdoc-topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    background: var(--color-background-primary);
  }

  .doc-icon {
    width: 28px; height: 34px;
    background: #4285f4;
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .doc-icon::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 8px; height: 8px;
    background: var(--color-background-primary);
    border-bottom-left-radius: 3px;
  }
  .doc-icon i { color: #fff; font-size: 14px; margin-top: 4px; }

  .doc-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--color-text-primary);
    border: none;
    background: transparent;
    outline: none;
    flex: 1;
    min-width: 0;
  }
  .doc-title:focus { text-decoration: underline; text-decoration-color: var(--color-border-secondary); }

  .top-actions { display: flex; gap: 6px; margin-left: auto; }

  .btn-pill {
    display: flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-secondary);
    background: transparent;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-primary);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
  }
  .btn-pill:hover { background: var(--color-background-secondary); }
  .btn-pill.primary { background: #4285f4; color: #fff; border-color: #4285f4; }
  .btn-pill.primary:hover { background: #3367d6; }

  .tab-bar {
    display: flex;
    gap: 0;
    padding: 0 14px;
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
  }
  .tab {
    padding: 6px 14px;
    font-size: 13px;
    color: var(--color-text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
  }
  .tab.active { color: #4285f4; border-bottom-color: #4285f4; font-weight: 500; }
  .tab:hover:not(.active) { color: var(--color-text-primary); background: var(--color-background-secondary); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 4px 10px;
    background: var(--color-background-primary);
    border-bottom: 0.5px solid var(--color-border-tertiary);
    flex-wrap: wrap;
  }
  .tb-sep {
    width: 0.5px;
    height: 20px;
    background: var(--color-border-secondary);
    margin: 0 4px;
  }
  .tb-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 26px;
    border-radius: 4px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--color-text-secondary);
    transition: background 0.12s, color 0.12s;
  }
  .tb-btn:hover { background: var(--color-background-secondary); color: var(--color-text-primary); }
  .tb-btn i { font-size: 16px; }

  .tb-select {
    font-size: 12px;
    border: 0.5px solid var(--color-border-secondary);
    border-radius: 4px;
    background: transparent;
    color: var(--color-text-primary);
    padding: 2px 4px;
    cursor: pointer;
    height: 26px;
  }

  .editor-area {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .editor-pane, .preview-pane {
    flex: 1;
    overflow-y: auto;
    padding: 32px 36px;
    background: var(--color-background-primary);
  }
  .editor-pane { border-right: 0.5px solid var(--color-border-tertiary); }

  .editor-pane textarea {
    width: 100%;
    height: 100%;
    min-height: 400px;
    border: none;
    outline: none;
    resize: none;
    font-family: 'Google Sans Mono', 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.7;
    color: var(--color-text-primary);
    background: transparent;
  }

  .preview-pane {
    font-size: 15px;
    line-height: 1.7;
    color: var(--color-text-primary);
  }
  .preview-pane h1 { font-size: 24px; font-weight: 500; margin: 0 0 16px; border-bottom: 0.5px solid var(--color-border-tertiary); padding-bottom: 8px; }
  .preview-pane h2 { font-size: 20px; font-weight: 500; margin: 20px 0 10px; }
  .preview-pane h3 { font-size: 17px; font-weight: 500; margin: 16px 0 8px; }
  .preview-pane p { margin: 0 0 12px; }
  .preview-pane ul, .preview-pane ol { margin: 0 0 12px 20px; }
  .preview-pane li { margin-bottom: 4px; }
  .preview-pane code { font-family: monospace; background: var(--color-background-secondary); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  .preview-pane pre { background: var(--color-background-secondary); padding: 12px; border-radius: 8px; overflow-x: auto; margin: 0 0 12px; }
  .preview-pane pre code { background: none; padding: 0; }
  .preview-pane blockquote { border-left: 3px solid #4285f4; padding-left: 14px; margin: 0 0 12px; color: var(--color-text-secondary); }
  .preview-pane hr { border: none; border-top: 0.5px solid var(--color-border-secondary); margin: 16px 0; }
  .preview-pane a { color: #4285f4; }
  .preview-pane strong { font-weight: 500; }
  .preview-pane table { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: 14px; }
  .preview-pane th, .preview-pane td { border: 0.5px solid var(--color-border-secondary); padding: 6px 10px; text-align: left; }
  .preview-pane th { background: var(--color-background-secondary); font-weight: 500; }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 4px 14px;
    background: var(--color-background-primary);
    border-top: 0.5px solid var(--color-border-tertiary);
    font-size: 12px;
    color: var(--color-text-secondary);
  }
  .status-bar span { display: flex; align-items: center; gap: 4px; }

  .toast {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: #fff;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    white-space: nowrap;
    z-index: 10;
  }
  .toast.show { opacity: 1; }

  .single-view .editor-pane { border-right: none; }
  .single-view .preview-pane { display: none; }
  .only-preview .editor-pane { display: none; }
  .only-preview .preview-pane { border-left: none; }
</style>

<div class="gdoc-shell" id="shell">
  <div class="gdoc-topbar">
    <div class="doc-icon"><i class="ti ti-file-text" aria-hidden="true"></i></div>
    <input class="doc-title" id="docTitle" type="text" value="Untitled document" spellcheck="false" />
    <div class="top-actions">
      <button class="btn-pill" id="copyBtn" onclick="copyMarkdown()"><i class="ti ti-copy" aria-hidden="true"></i> Copy</button>
      <button class="btn-pill primary" id="saveBtn" onclick="saveMarkdown()"><i class="ti ti-download" aria-hidden="true"></i> Save .md</button>
    </div>
  </div>

  <div class="tab-bar">
    <div class="tab active" id="tab-edit" onclick="setMode('edit')">Edit</div>
    <div class="tab" id="tab-split" onclick="setMode('split')">Split</div>
    <div class="tab" id="tab-preview" onclick="setMode('preview')">Preview</div>
  </div>

  <div class="toolbar" id="toolbar">
    <select class="tb-select" id="headingSelect" onchange="insertHeading(this.value)">
      <option value="">Paragraph</option>
      <option value="# ">Heading 1</option>
      <option value="## ">Heading 2</option>
      <option value="### ">Heading 3</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Bold" onclick="wrap('**','**')"><i class="ti ti-bold"></i></button>
    <button class="tb-btn" title="Italic" onclick="wrap('_','_')"><i class="ti ti-italic"></i></button>
    <button class="tb-btn" title="Strikethrough" onclick="wrap('~~','~~')"><i class="ti ti-strikethrough"></i></button>
    <button class="tb-btn" title="Inline code" onclick="wrap('`','`')"><i class="ti ti-code"></i></button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Bullet list" onclick="insertLine('- ')"><i class="ti ti-list"></i></button>
    <button class="tb-btn" title="Numbered list" onclick="insertLine('1. ')"><i class="ti ti-list-numbers"></i></button>
    <button class="tb-btn" title="Blockquote" onclick="insertLine('> ')"><i class="ti ti-blockquote"></i></button>
    <button class="tb-btn" title="Code block" onclick="insertCodeBlock()"><i class="ti ti-terminal-2"></i></button>
    <div class="tb-sep"></div>
    <button class="tb-btn" title="Horizontal rule" onclick="insertAtCursor('\n---\n')"><i class="ti ti-minus"></i></button>
    <button class="tb-btn" title="Link" onclick="insertLink()"><i class="ti ti-link"></i></button>
    <button class="tb-btn" title="Table" onclick="insertTable()"><i class="ti ti-table"></i></button>
  </div>

  <div class="editor-area only-preview" id="editorArea">
    <div class="editor-pane" id="editorPane">
      <textarea id="editor" spellcheck="true" placeholder="Start writing in Markdown..."></textarea>
    </div>
    <div class="preview-pane" id="previewPane"></div>
  </div>

  <div class="status-bar">
    <span id="wordCount"><i class="ti ti-text-size" aria-hidden="true"></i> 0 words</span>
    <span id="lineCount"><i class="ti ti-list" aria-hidden="true"></i> 0 lines</span>
    <span id="charCount"><i class="ti ti-cursor-text" aria-hidden="true"></i> 0 chars</span>
    <span style="margin-left:auto; color: #4285f4;" id="saveStatus"><i class="ti ti-check" aria-hidden="true"></i> Ready</span>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
const editor = document.getElementById('editor');
const preview = document.getElementById('previewPane');
const shell = document.getElementById('shell');
const area = document.getElementById('editorArea');
let mode = 'split';

const DEFAULT = `# Welcome to Markdown Editor

Write here and see a **live preview** on the right.

## Features
- Bold, italic, strikethrough
- Headings, lists, blockquotes
- Code blocks and inline \`code\`
- Tables and links

## Example Table

| Feature | Status |
|---------|--------|
| Live preview | ✅ |
| Save as .md | ✅ |
| Copy to clipboard | ✅ |

> Start typing to replace this content.
`;

editor.value = DEFAULT;
renderPreview();
updateStats();

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + m).classList.add('active');

  area.className = 'editor-area';
  if (m === 'edit') area.classList.add('single-view');
  else if (m === 'preview') area.classList.add('only-preview');

  document.getElementById('toolbar').style.display = m === 'preview' ? 'none' : 'flex';
}

setMode('split');

editor.addEventListener('input', () => {
  renderPreview();
  updateStats();
  setSaveStatus('Editing...');
});

function renderPreview() {
  if (typeof marked !== 'undefined') {
    preview.innerHTML = marked.parse(editor.value);
  }
}

function updateStats() {
  const text = editor.value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const lines = text.split('\n').length;
  document.getElementById('wordCount').innerHTML = `<i class="ti ti-text-size" aria-hidden="true"></i> ${words} word${words !== 1 ? 's' : ''}`;
  document.getElementById('lineCount').innerHTML = `<i class="ti ti-list" aria-hidden="true"></i> ${lines} line${lines !== 1 ? 's' : ''}`;
  document.getElementById('charCount').innerHTML = `<i class="ti ti-cursor-text" aria-hidden="true"></i> ${text.length} chars`;
}

function setSaveStatus(msg, color) {
  const el = document.getElementById('saveStatus');
  el.style.color = color || '#4285f4';
  el.innerHTML = `<i class="ti ti-check" aria-hidden="true"></i> ${msg}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function saveMarkdown() {
  const title = document.getElementById('docTitle').value.trim() || 'document';
  const filename = title.replace(/[^a-z0-9\-_\s]/gi, '').replace(/\s+/g, '-').toLowerCase() + '.md';
  const blob = new Blob([editor.value], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
  setSaveStatus('Saved!', '#1d9e75');
  showToast(`Saved as ${filename}`);
  setTimeout(() => setSaveStatus('Ready'), 3000);
}

function copyMarkdown() {
  navigator.clipboard.writeText(editor.value).then(() => {
    showToast('Copied to clipboard!');
  }).catch(() => {
    const tmp = document.createElement('textarea');
    tmp.value = editor.value;
    document.body.appendChild(tmp);
    tmp.select();
    document.execCommand('copy');
    document.body.removeChild(tmp);
    showToast('Copied!');
  });
}

function getSelection() {
  const start = editor.selectionStart;
  const end = editor.selectionEnd;
  return { start, end, text: editor.value.substring(start, end) };
}

function wrap(before, after) {
  const { start, end, text } = getSelection();
  const replacement = before + (text || 'text') + after;
  editor.setRangeText(replacement, start, end, 'select');
  editor.focus();
  renderPreview(); updateStats();
}

function insertLine(prefix) {
  const pos = editor.selectionStart;
  const val = editor.value;
  const lineStart = val.lastIndexOf('\n', pos - 1) + 1;
  editor.setRangeText('\n' + prefix, pos, pos, 'end');
  editor.focus();
  renderPreview(); updateStats();
}

function insertAtCursor(text) {
  const pos = editor.selectionStart;
  editor.setRangeText(text, pos, pos, 'end');
  editor.focus();
  renderPreview(); updateStats();
}

function insertHeading(prefix) {
  if (!prefix) return;
  insertAtCursor('\n' + prefix + 'Heading\n');
  document.getElementById('headingSelect').value = '';
}

function insertCodeBlock() {
  const { start, end, text } = getSelection();
  const block = '\n```\n' + (text || 'code here') + '\n```\n';
  editor.setRangeText(block, start, end, 'end');
  editor.focus();
  renderPreview(); updateStats();
}

function insertLink() {
  const { start, end, text } = getSelection();
  const replacement = '[' + (text || 'link text') + '](https://url.com)';
  editor.setRangeText(replacement, start, end, 'end');
  editor.focus();
  renderPreview(); updateStats();
}

function insertTable() {
  const tbl = '\n| Column 1 | Column 2 | Column 3 |\n|----------|----------|----------|\n| Cell | Cell | Cell |\n| Cell | Cell | Cell |\n';
  insertAtCursor(tbl);
}

editor.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey) {
    if (e.key === 'b') { e.preventDefault(); wrap('**','**'); }
    if (e.key === 'i') { e.preventDefault(); wrap('_','_'); }
    if (e.key === 's') { e.preventDefault(); saveMarkdown(); }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const pos = editor.selectionStart;
    editor.setRangeText('  ', pos, pos, 'end');
    renderPreview();
  }
});
</script>
